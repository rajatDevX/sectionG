<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodePath Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-gray-900">
    <header class="sticky top-0 z-50 bg-white shadow-sm">
      <nav
        class="max-w-6xl mx-auto flex flex-wrap justify-between items-center px-4 py-4 gap-4"
      >
        <a href="#" class="text-2xl font-bold text-indigo-700 font-medium"
          >CodePath</a
        >
        <div class="flex flex-wrap gap-5">
          <a href="#home" class="hover:text-indigo-600">Home</a>
          <a href="#courses" class="hover:text-indigo-600">Courses</a>
          <a href="#about" class="hover:text-indigo-600">About</a>
          <a href="#contact" class="hover:text-indigo-600">Contact</a>
        </div>
      </nav>
    </header>
    <main>
      <section id="home" class="bg-indigo-50 scroll-mt-32">
        <div class="max-w-6xl mx-auto px-4 py-16 md:py-24 flex flex-col md:flex-row items-center gap-10">
          <div class="w-full md:w-1/2">
            <p class="text-indigo-700 font-semibold mb-3">LEARN. BUILD. GROW.</p>
            <h1 class="text-4xl md:text-5xl font-bold leading-[10px]">Start your coding journey with us.</h1>
            <p class="leading-[30px] mt-3">
              Learn web development through practical lessons, guided projects
              and regular coding practice.
            </p>
            <a href="#courses">Explore Courses</a>
          </div>
          <div class="w-full md:w-1/2">
            <img src="image4.png" alt="code" class="w-full h-72 object-cover shadow-xl rounded-2xl" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
