<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-800">

                    <span class="absolute bg-red-800 text-white top-3 right-3 rounded-full px-3 py-1">SALE</span>
                </div>
            </article>
            <article></article>
            <article></article>
            <article></article>
            <article></article>
            <article></article>

        </div>

    </main>
    
</body>
</html>
