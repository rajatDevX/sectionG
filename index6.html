<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size:40px;
            line-height:4;
        }
        .first{
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size:1rem;
            font-weight:bold;
            text-transform: capitalize;
            text-decoration:underline;
            text-align:center;
            text-shadow:2px 2px 5px red;
            font-style:italic;

        }
        .second{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size:2rem;
            font-weight: normal;
            text-transform: lowercase;
            text-decoration:line-through;
            text-align:right;
            text-shadow:3px 3px 5px blue;
            font-style:oblique;
        }
        div.third{
            font-size:50px;
        }
        div.third p{
            font-size:1em;
            font-weight:600px;
            text-transform: uppercase;
            text-decoration:overline;
            text-shadow:2px 2px 5px green;
            word-spacing:10px;
            letter-spacing:15px;
           
            
        }
    </style>
</head>
<body>
    <div class="first">
        this is a container inside first class
    </div>
    <div class="second">
        this is container inside second class
    </div>
    <div class="third">
        <p>this is paragraph inside third class div</p>
    </div>
    
</body>
</html>
