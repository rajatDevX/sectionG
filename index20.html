<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spice Route | Restaurant</title>
    <link rel="shortcut icon" href="favicon1.png" type="image/png" />
    <style>
      :root {
        --ink: #2b2118;
        --accent: #c1440e;
        --bg: #fff8f0;
        --line: #e6dccb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background-color: var(--bg);
        line-height: 1.6;
        font-family: Georgia, "Times New Roman", Times, serif;
      }
      header {
        background-color: var(--ink);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        flex-wrap: wrap;
      }
      header h1 {
        margin: 0;
        font-size: 1.8rem;
        letter-spacing: 1px;
      }
      .hero {
        background:
          linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
          url(hero1.png) center/cover;
        color: #fff;
        text-align: center;
        padding: 90px 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Spice Route</h1>
      <nav>
        <a href="#special">Today`s Special</a>
        <a href="#menu">Menu </a>
        <a href="#gallery">Gallery</a>
        <a href="#reviews">Reviews</a>
        <a href="#hours">Hours</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
    <div class="hero">
      <h2>Authentic Flavours, Homely Taste</h2>
    </div>
    <section id="special"></section>
    <section id="menu"></section>
    <section id="gallery"></section>
    <section id="reviews"></section>
    <section id="hours">
      <table>
        <thead>
          <tr>
            <th>Day</th>
            <th>Lunch</th>
            <th>Dinner</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Mon</td>
            <td>12 - 3 PM</td>
            <td>7 - 11 PM</td>
          </tr>
          <tr>
            <td>Tue</td>
            <td>12 - 3 PM</td>
            <td>7 - 11 PM</td>
          </tr>
          <tr>
            <td>Wed</td>
            <td>Closed</td>
            <td>7 - 11 PM</td>
          </tr>
        </tbody>
      </table>
    </section>
    <section id="contact"></section>
    <footer>
      <p>123 MG Road, Agra | +91 98765 12345</p>
      <p>&copy; 2026 Spice Route Restaurant</p>
    </footer>
  </body>
</html>
