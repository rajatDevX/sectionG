<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      body {
        height: 100vh;
        width: 100vw;
      }
      .box {
        border: 1px solid black;
      }
      .container {
        height: 100%;
        width: 100%;
        display: grid;
        background-color: antiquewhite;
        grid-template-areas:
          "header header"
          "sidebar content"
          "footer footer";
          gap:5px;
      }
      .header{
        grid-area:header;
      }
      .sidebar{
        grid-area:sidebar;
      }
      .footer{
        grid-area:footer;
      }
      .content{
        grid-area:content;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <div class="box header">header</div>
      <div class="box sidebar">sidebar</div>
      <div class="box content">content</div>
      <div class="box footer">footer</div>
    </div>
  </body>
</html>
