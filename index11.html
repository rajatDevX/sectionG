<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box model</title>
    <style>
      * {
        margin: 0px;
        box-sizing:border-box;
      }
      .first {
        border: 2px solid black;
        height: 200px;
        width: 200px;
        padding: 10px;
      }
      .second{
        margin:20px 30px 40px 50px;
        border:1px solid black;
        padding:40px;
        height:200px;
        width:200px;
      }
    </style>
  </head>
  <body>
    <div class="first">this is content inside first box.</div>
    <div class="second">
      this is a heading element
    </div>
  </body>
</html>
