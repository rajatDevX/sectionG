<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumping balls</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 10px;
      }
      .box {
        height: 50px;
        width: 50px;
        background-color: tomato;
        border-radius: 50%;
        gap: 10px;
        animation:jump 1.3s infinite;
      }
      .box:nth-child(1) {
        animation-delay: 0.6s;
      }
      .box:nth-child(2) {
          animation-delay: 0.3s;
      }
      .box:nth-child(3) {
          animation-delay:0s;
      }
      @keyframes jump{
        0%,100%{
            transform:translateY(0px);
        }
        50%{
            transform:translateY(100px);
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </body>
</html>
