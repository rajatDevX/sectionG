<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D css</title>
    <style>
        .scene{
            display:flex;
            justify-content: center;
            align-items:center;
            height:100vh;
            perspective: 500px;
        }
        .box{
            height:100px;
            width:300px;
            /* transform:rotateY(120deg); */
            border:1px solid black;
            background-color: tomato;
            transition: all 3s;
        }
        .box:hover{
            transform:rotateY(10deg) rotateX(10deg);
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="box"></div>
    </div>
</body>
</html>
