<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic light</title>
    <style>
        .container{
            width:120px;
            background-color: rgb(71, 56, 56);
            padding:20px;
            margin:100px auto;
            display:flex;
            flex-direction:column;
            gap:20px;
            align-items: center;
        }
        .circle{
            height:70px;
            width:70px;
            border-radius: 50%;
            opacity:0.2;
        }
        .red{
            background-color: red;
            animation:red 6s infinite;
        }
        .yellow{
            background-color: yellow;
            animation:yellow 6s infinite;
        }
        .green{
            background-color: green;
            animation:green 6s infinite;
        }
        @keyframes red{
            0%,33%{
                opacity:1
            }
            34%,100%{
                opacity:0.2
            }


        }
        @keyframes yellow{
            0%,33%{
                opacity:0.2
            }
            34%,67%{
                opacity:1
            }
            68%,100%{
                opacity:0.2
            }
        }
        @keyframes green{
            0%,67%{
                opacity:0.2
            }
            68%,100%{
                opacity:1
            }   
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle red"></div>
        <div class="circle yellow"></div>
        <div class="circle green"></div>
    </div>
</body>
</html>
