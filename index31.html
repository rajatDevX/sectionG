<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex justify-center items-center bg-gray-100">
    <main class="w-full max-w-sm bg-white rounded-2xl shadow-lg text-center p-8">
      <img class="w-24 h-24 object-contain object-center border-4 rounded-full mx-auto border-blue-100" src="image copy.png" alt="pic" />
      <h1 class="font-bold text-2xl mt-4">Rajat Jain</h1>
      <p class=" mt-1 text-blue-600 font-medium">Frontend Development Student</p>
      <p class="text-sm mt-2 text-gray-600">
        I am learning to build beautiful and responsive websites using HTML, CSS
        and Tailwind CSS.
      </p>
      <div class="flex justify-center gap-4 mt-3">
        <span class="bg-blue-100 text-blue-500 rounded-2xl px-3 py-2">HTML</span>
        <span class="bg-orange-100 text-orange-500 rounded-2xl px-3 py-2">CSS</span>
        <span class="bg-cyan-100 text-cyan-500 rounded-2xl px-3 py-2">Tailwind</span>
      </div>
      <details>
        <summary class="bg-blue-600  text-white rounded-lg px-3 py-2 list-none mt-2 hover:bg-blue-700 transition-colors">view Profile</summary>
        <p class="text-sm mt-4 text-gray-500">My goal is to create five responsive projects this semester.</p>
      </details>
    </main>
  </body>
</html>
