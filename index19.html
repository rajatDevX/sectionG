<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body{
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
        }
        .card{
            width:350px;
            border:2px solid #aaa;
            padding:20px;
            height:300px;
            text-align: center;
            transition: all 1s;
            overflow: hidden;
        }
        .card img{
            width:100%;
            height:50%;
        }
        .card:hover img{
            transform:scale(1.2);
        }
        .card:hover{
            box-shadow:0 0 10px rgba(0,0,0,0.5);
            transform:translateY(10px);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="headphone.png" alt="headphone">
        <h2>Wireless Bluetooth Headphone</h2>
        <p>A very good quality true wireless headphone</p>
        <button>Buy</button>
    </div>
     <div class="card">
        <img src="cricket.png" alt="headphone">
        <h2>Wireless Bluetooth Headphone</h2>
        <p>A very good quality true wireless headphone</p>
        <button>Buy</button>
    </div>
    
</body>
</html>
